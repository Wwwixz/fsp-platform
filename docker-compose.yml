services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
    volumes:
      - fsp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./fsp-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/fsp
      DB_USER: fsp
      DB_PASSWORD: fsp
      JWT_SECRET: fsp-platform-dev-secret-key-change-me-in-production-0123456789abcdef
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  fsp-pgdata:
